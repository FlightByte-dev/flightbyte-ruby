version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: Dependencies
    # Every gem in the Gemfile is for development; the gem itself has none.
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: CI
    groups:
      actions:
        patterns: ['*']
